services:
  librechat:
    build: .   # Tells Docker to build from a Dockerfile in this directory
    ports:
      - "3080:3080"
    env_file:
      - ../.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
    volumes:
      - ../librechat.yaml:/app/librechat.yaml
      - ../tools:/app/tools
      - ../:/workspace   # Mounts your repository root to /workspace inside the container
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    volumes:
      - chat_data:/data/db

volumes:
  chat_data: